<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open Calls</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161514" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://script.google.com">
<script src="config.js"></script>
<style>
:root {
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg:#faf8f5;--surface:#fff;--sunk:#f2efea;--ink:#1f1e1c;--ink2:#57534e;--ink3:#6f6a64;--line:#e5e1da;
  --primary:#1f1e1c;--on-primary:#fff;
  --red-bg:#fbe9e6;--red:#9f2a1d;--amber-bg:#fdf1dc;--amber:#7f4c00;--green-bg:#e4f2e7;--green:#1d6a33;
  --blue-bg:#e8f0fb;--blue:#1a5fb4;--purple-bg:#f0e8f8;--purple:#6c3fa0;
  --focus:0 0 0 3px rgba(31,30,28,.22);--nav-h:64px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161514;--surface:#211f1d;--sunk:#2b2926;--ink:#f2efea;--ink2:#c9c3bb;--ink3:#a8a197;--line:#3a3633;
  --primary:#f2efea;--on-primary:#161514;
  --red-bg:#3d1c18;--red:#f4a196;--amber-bg:#3b2c12;--amber:#f2c46e;--green-bg:#17331f;--green:#90d6a4;
  --blue-bg:#1a2a3d;--blue:#7ab3f0;--purple-bg:#2a1f3d;--purple:#c4a0f0;
  --focus:0 0 0 3px rgba(242,239,234,.28);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#161514;--surface:#211f1d;--sunk:#2b2926;--ink:#f2efea;--ink2:#c9c3bb;--ink3:#a8a197;--line:#3a3633;
  --primary:#f2efea;--on-primary:#161514;
  --red-bg:#3d1c18;--red:#f4a196;--amber-bg:#3b2c12;--amber:#f2c46e;--green-bg:#17331f;--green:#90d6a4;
  --blue-bg:#1a2a3d;--blue:#7ab3f0;--purple-bg:#2a1f3d;--purple:#c4a0f0;
  --focus:0 0 0 3px rgba(242,239,234,.28);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:15px/1.45 var(--font);background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box;margin:0}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.frame{max-width:420px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(var(--nav-h) + 24px)}

/* Shell */
.top-bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px;min-height:56px}
.top-bar h1{flex:1;font-size:22px;font-weight:600;letter-spacing:-.2px}
.avatar{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;font-weight:600;font-size:13px;cursor:pointer;overflow:hidden;padding:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.back-btn{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--ink2);min-height:44px;padding:0 8px 0 0;cursor:pointer;font-weight:500;font-size:15px}
.back-btn svg{width:20px;height:20px}

/* Bottom nav — 4 tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs a{flex:1;max-width:110px;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink3);text-decoration:none;font-size:11px;font-weight:600;cursor:pointer;position:relative;border:0;background:none}
nav.tabs a.active{color:var(--ink)}
nav.tabs a.active svg{stroke-width:2.2}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--primary);color:var(--on-primary);font-size:11px;line-height:18px;text-align:center}
.badge:empty{display:none}

/* FAB */
.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:35;width:56px;height:56px;border-radius:50%;background:var(--primary);color:var(--on-primary);border:0;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.fab:active{transform:scale(.93)}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}

/* Sub-tabs (Drafts / Inbox / Archive) */
.sub-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:12px}
.sub-tabs button{flex:1;min-height:44px;background:none;border:0;border-bottom:2px solid transparent;font:inherit;font-weight:600;font-size:14px;color:var(--ink3);cursor:pointer;padding:0}
.sub-tabs button.active{color:var(--ink);border-bottom-color:var(--ink)}

/* Shared components */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:12px;border:0;background:var(--sunk);color:var(--ink);font-weight:600;cursor:pointer;font:inherit}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:transparent;color:var(--ink2);min-height:44px;padding:0 10px}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px;cursor:pointer}
.card:active{background:var(--sunk)}
.card h3{font-size:16px;font-weight:600;margin:0 0 2px;line-height:1.3}
.card .sub{font-size:13px;color:var(--ink2)}
.card .foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--ink3)}

.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;color:var(--ink);gap:6px}
.chip.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.chip.dashed{border-style:dashed;background:transparent;color:var(--ink2)}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:8px}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.blue{background:var(--blue-bg);color:var(--blue)}
.pill.purple{background:var(--purple-bg);color:var(--purple)}
.pill.muted{background:var(--sunk);color:var(--ink2)}

.dl{flex:none;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.dl.urgent{background:var(--red-bg);color:var(--red)}
.dl.soon{background:var(--amber-bg);color:var(--amber)}
.dl.past{text-decoration:line-through}

.search-bar{position:relative;margin-bottom:8px}
.search-bar input{width:100%;min-height:44px;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:inherit;color:var(--ink)}
.search-bar svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--ink3);fill:none;stroke-width:2}

.filters{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
select.chip{appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}

.section-label{font-size:13px;font-weight:600;color:var(--ink2);margin:20px 0 10px;text-transform:uppercase;letter-spacing:.5px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:14px 0 6px}
label.lbl:first-child{margin-top:0}
input.f,select.f,textarea.f{width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:inherit;color:var(--ink)}
textarea.f{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field .note{display:none;font-size:12px;color:var(--amber);margin-top:4px}
.field.missing input.f,.field.missing select.f,.field.missing textarea.f{border-color:var(--amber);background:var(--amber-bg)}
.field.missing .note{display:block}

.empty{text-align:center;padding:48px 16px;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.skel{height:92px;border-radius:14px;margin-bottom:8px;background:linear-gradient(90deg,var(--surface) 30%,var(--sunk) 50%,var(--surface) 70%);background-size:300% 100%;animation:sk 1.3s infinite linear}
@keyframes sk{to{background-position:-150% 0}}
.err-box{padding:14px;border-radius:12px;background:var(--red-bg);color:var(--red)}

/* Artist avatar */
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:600;background:var(--sunk);color:var(--ink2);flex:none}
.av.c1{background:#e8d5c4;color:#6b4226}
.av.c2{background:#c4d5e8;color:#264a6b}
.av.c3{background:#d5e8c4;color:#3a6b26}
.av.c4{background:#e8c4d5;color:#6b2649}
.avs{display:flex;margin-right:4px}
.avs .av{width:24px;height:24px;font-size:11px;border:2px solid var(--surface);margin-right:-6px}

/* Flow / trail */
.trail{display:flex;flex-direction:column;gap:0;margin:12px 0}
.trail-step{display:flex;align-items:flex-start;gap:12px;padding:6px 0;position:relative}
.trail-step .dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;position:relative;z-index:1}
.trail-step .dot.done{background:var(--green-bg);color:var(--green)}
.trail-step .dot.done::after{content:'✓'}
.trail-step .dot.current{background:var(--primary);color:var(--on-primary);width:28px;height:28px;margin:-2px -2px 0}
.trail-step .dot.future{background:var(--sunk);color:var(--ink3)}
.trail-step .dot.future::after{content:''}
.trail-step .content{flex:1;min-width:0;padding-top:2px}
.trail-step .content .step-title{font-size:14px;font-weight:600}
.trail-step .content .step-meta{font-size:12px;color:var(--ink3);margin-top:1px}
.trail-step .content .step-action{margin-top:8px}
.trail-step:not(:last-child)::before{content:'';position:absolute;left:11px;top:30px;bottom:-6px;width:2px;background:var(--line)}
.trail-step:not(:last-child) .dot.done+.content ~ .trail-step::before,
.trail-step .dot.done ~ .trail-step::before{background:var(--green-bg)}

/* Pipeline bar */
.pipeline{display:flex;flex-direction:column;gap:4px}
.pipe-row{display:flex;align-items:center;gap:10px;font-size:13px}
.pipe-row .label{width:90px;text-align:right;color:var(--ink2);font-weight:500;flex:none}
.pipe-row .bar-wrap{flex:1;height:28px;background:var(--sunk);border-radius:8px;overflow:hidden;position:relative}
.pipe-row .bar{height:100%;border-radius:8px;display:flex;align-items:center;padding-left:8px;font-weight:600;font-size:12px;color:#fff;min-width:fit-content;transition:width .3s}
.pipe-row .count{width:28px;text-align:right;font-weight:600;flex:none}

/* Dashboard stat */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat .n{font-size:28px;font-weight:700;line-height:1.1;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--ink2);font-weight:500;margin-top:2px}

/* Who-are-you */
#whoAreYou{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.person-list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}
.person-btn{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.person-btn:active{background:var(--sunk)}
.person-btn .name{font-weight:600}
.person-btn .role{font-size:13px;color:var(--ink2)}

/* Approval bar */
.approval-bar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.approval-bar .who{font-size:12px;color:var(--ink3);margin-bottom:10px}
.approval-bar .btns{display:flex;gap:8px}
.approval-bar .btns .btn{flex:1}

/* Doc preview */
.doc-preview{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.doc-preview .item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.doc-preview .item:last-child{border:0}
.doc-preview .item .title{font-weight:500}
.doc-preview .item .meta{font-size:12px;color:var(--ink3)}

/* Deadline list */
.deadline-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.deadline-item:last-child{border:0}
.deadline-item .info{flex:1;min-width:0}
.deadline-item .info .t{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deadline-item .info .a{font-size:12px;color:var(--ink3)}

/* Fee */
.fee-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.fee-row:last-child{border:0}
.fee-row .amount{font-weight:600;font-variant-numeric:tabular-nums}

/* Views */
.view{display:none}
.view.active{display:block;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.view.active{animation:none}}

/* Modals & Toast */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:420px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1),visibility .28s;max-height:85dvh;overflow:auto}
.sheet.open{visibility:visible;transform:none}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:18px;margin:0 0 6px;font-weight:600}
.sheet p{margin:0 0 16px;color:var(--ink2)}
.sheet .btns{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.toast{visibility:hidden;position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:60;transform:translate(-50%,200%);display:flex;align-items:center;gap:12px;max-width:min(92vw,380px);padding:10px 10px 10px 16px;border-radius:12px;background:var(--primary);color:var(--on-primary);font-size:14px;transition:transform .22s,visibility .22s;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast.show{visibility:visible;transform:translate(-50%,0)}
.toast.err{background:var(--red);color:#fff}
.toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;min-height:36px;padding:0 6px;cursor:pointer}
.msg{margin-top:16px;padding:12px;border-radius:12px;font-size:14px}
.msg.err{background:var(--red-bg);color:var(--red)} .msg.ok{background:var(--green-bg);color:var(--green)}
.msg:empty{display:none}
</style>
</head>
<body>

<!-- ============ Sign in ============ -->
<section id="signin" hidden style="display:flex;align-items:center;justify-content:center;min-height:100vh">
  <div style="max-width:340px;width:100%;text-align:center">
    <div style="width:56px;height:56px;border-radius:16px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700;font-size:19px;margin:0 auto 18px;letter-spacing:-.5px">OC</div>
    <h1 style="font-size:22px;font-weight:600;margin-bottom:8px">Open Calls</h1>
    <p style="color:var(--ink2);margin-bottom:28px" id="signText">Track open calls and send them to your artists.</p>
    <div id="gsiBtn" style="display:flex;justify-content:center;min-height:44px"></div>
    <div id="pendingBox" hidden style="margin-top:16px">
      <button class="btn primary block" id="btnCheckAgain">Check again</button>
      <button class="btn ghost block" id="btnOtherAccount" style="margin-top:8px">Use a different account</button>
    </div>
    <p style="font-size:13px;color:var(--ink3);margin-top:14px" id="domainHint"></p>
    <div class="msg" id="signMsg" role="status" aria-live="polite"></div>
  </div>
</section>

<!-- ============ Who Are You ============ -->
<section id="whoAreYou" hidden>
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:85vh;text-align:center;width:100%">
    <div style="width:56px;height:56px;border-radius:16px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700;font-size:19px;margin-bottom:18px;letter-spacing:-.5px">OC</div>
    <h2 style="font-size:20px;font-weight:600;margin-bottom:6px">Who's using the app?</h2>
    <p style="color:var(--ink2);margin-bottom:24px;max-width:280px">Pick your name. You only do this once on this device.</p>
    <div class="person-list" id="personList"></div>
    <div class="new-person-form" id="newPersonForm" hidden style="margin-top:20px;width:100%;max-width:320px">
      <input class="f" id="newPersonName" placeholder="Your name" maxlength="40" autocomplete="off">
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn ghost" id="cancelNewPerson" type="button" style="flex:1">Cancel</button>
        <button class="btn primary" id="saveNewPerson" type="button" style="flex:1">Continue</button>
      </div>
    </div>
    <div class="msg" id="whoMsg" role="status" aria-live="polite"></div>
  </div>
</section>

<!-- ============ App ============ -->
<div id="app" hidden>
  <div class="frame">
    
    <!-- Header -->
    <header class="top-bar" id="appHeader">
      <button class="back-btn" id="btnBack" hidden onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg><span id="backLabel">Back</span></button>
      <h1 id="pageTitle">Open Calls</h1>
      <div class="avatar" id="btnAccount"></div>
    </header>

    <!-- Inbox -->
    <div class="view active" id="v-inbox">
      <div class="sub-tabs" id="subTabs">
        <button data-sub="drafts">Drafts <span style="color:var(--ink3);font-weight:400" id="sbadge-drafts"></span></button>
        <button data-sub="inbox" class="active">Inbox <span style="color:var(--ink3);font-weight:400" id="sbadge-inbox"></span></button>
        <button data-sub="archive">Archive</button>
      </div>
      <div class="search-bar">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="Search title, organiser, artist" autocomplete="off">
      </div>
      <div class="filters">
        <button class="chip" id="fSoon">Closing soon</button>
        <select class="chip" id="fCat">
          <option value="">Call</option>
          <option>Open Call</option><option>Exhibition</option><option>Exhibition &amp; Prize</option>
          <option>Exhibition Proposal</option><option>Online Exhibition</option><option>Competition</option>
          <option>Competition &amp; Prize</option><option>Prize</option><option>Grant</option>
          <option>Residency</option><option>Solo Show</option><option>Group Show</option>
          <option>Gallery</option><option>Publication</option><option>Award</option>
          <option>Mentorship</option><option>Platform</option><option>Institution</option>
          <option>Art Fair/Festival</option>
        </select>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';
const store = {
  get(k, d = '') { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  json(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const splitNames = v => String(v || '').split(',').map(s => s.trim()).filter(Boolean);
const initials = n => String(n).trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();

const FIELDS = ['title','deadline','type','fee','link','event_dates','announcement_date','organiser','location','eligibility'];
const SHEET_MAP = { title:'title', deadline:'deadline', type:'category', fee:'application fee', link:'application link', event_dates:'event dates', announcement_date:'announcement date', organiser:'organiser', location:'location', eligibility:'eligibility' };
const LISTS = {
  drafts:  { action: 'getQueue',    status: 'Pending',   empty: ['No drafts', 'Open calls you save without confirming wait here.'] },
  inbox:   { action: 'getInbox',    status: 'Confirmed', empty: ['Your Inbox is empty', 'Confirmed open calls appear here, ready to send to artists.'] },
  archive: { action: 'getArchived', status: 'Archived',  empty: ['Nothing archived', 'Archive calls that have closed or aren’t a fit.'] }
};
const TRAIL_STEPS = ['Assigned', 'Approved to send', 'In doc', 'Emailed', 'Responded', 'Applied', 'Outcome'];

let token = store.get('oc_token');
let me = store.json('oc_me', null);
let artists = store.json('oc_artists', []);
let personId = store.get('oc_personId');
let personName = store.get('oc_personName');
const lists = { drafts: store.json('oc_list_drafts', null), inbox: store.json('oc_list_inbox', null), archive: store.json('oc_list_archive', null) };
const filters = { drafts: {}, inbox: {}, archive: {} };
let route = { name: '', param: '' }, listTab = 'inbox';
let uploads = [], extracted = null, entry = null, dirty = false, isEditing = false;
const picked = new Set(), selected = new Set();

async function api(action, payload) {
  if (!window.API_URL || API_URL.indexOf('/exec') === -1) return { ok: false, message: 'The app isn’t set up yet (API_URL in config.js).' };
  try {
    const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action, token }, payload || {})) });
    const text = await res.text();
    let r; try { r = JSON.parse(text); } catch (e) { console.error(text); return { ok: false, message: 'The server sent an unexpected reply. The Apps Script deployment may need a new version.' }; }
    if (r && r.auth) { r.pending ? showPending(r.message) : signedOut(r.message); }
    return r;
  } catch (e) {
    return { ok: false, message: navigator.onLine ? 'Couldn’t reach the server. Check your connection and try again.' : 'You’re offline. Reconnect and try again.' };
  }
}

let toastTimer;
function toast(text, opts = {}) {
  $('toastText').textContent = text;
  const a = $('toastAction'); a.textContent = opts.action || ''; a.onclick = () => { hideToast(); opts.onAction && opts.onAction(); };
  $('toast').className = 'toast show' + (opts.error ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, opts.action ? 6000 : 3200);
}
function hideToast() { $('toast').className = 'toast'; }
function busy(btn, label) { if (!btn.dataset.label) btn.dataset.label = btn.textContent; btn.disabled = true; btn.textContent = label; }
function idle(btn) { btn.disabled = false; if (btn.dataset.label) btn.textContent = btn.dataset.label; delete btn.dataset.label; }
function msg(el, text, ok) { el.textContent = text || ''; el.className = 'msg ' + (ok ? 'ok' : 'err'); }

let lastFocus;
function sheet({ title, text = '', body = '', buttons = [] }) {
  lastFocus = document.activeElement;
  $('sheetTitle').textContent = title; $('sheetText').textContent = text; $('sheetText').hidden = !text;
  $('sheetBody').innerHTML = body; $('sheetBtns').innerHTML = '';
  buttons.forEach(b => { const el = document.createElement('button'); el.className = 'btn block ' + (b.style || ''); el.textContent = b.label; el.onclick = b.onClick; $('sheetBtns').appendChild(el); });
  $('backdrop').classList.add('open'); $('sheet').classList.add('open'); $('sheet').focus();
}
function closeSheet() { $('backdrop').classList.remove('open'); $('sheet').classList.remove('open'); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
function ask(title, text, okLabel, danger) {
  return new Promise(res => sheet({ title, text, buttons: [
    { label: okLabel, style: danger ? 'danger' : 'primary', onClick: () => { closeSheet(); res(true); } },
    { label: 'Cancel', onClick: () => { closeSheet(); res(false); } } ] }));
}
$('backdrop').onclick = closeSheet;

function deadlineInfo(d) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d || '')) return { text: 'No deadline', cls: '', days: Infinity };
  const [y, m, dd] = d.split('-').map(Number), dl = new Date(y, m - 1, dd), now = new Date(); now.setHours(0, 0, 0, 0);
  const days = Math.round((dl - now) / 86400000);
  const nice = dl.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  if (days < 0) return { text: 'Closed ' + nice, cls: 'past', days };
  if (days === 0) return { text: 'Due today', cls: 'urgent', days };
  if (days === 1) return { text: 'Due tomorrow', cls: 'urgent', days };
  if (days <= 7) return { text: days + ' days left', cls: 'urgent', days };
  if (days <= 21) return { text: nice, cls: 'soon', days };
  return { text: nice, cls: '', days };
}

/* Sign In & Who Are You */
let gsiLoaded = false;
function loadGsi() {
  if (gsiLoaded) return renderGsi();
  if (!window.GOOGLE_CLIENT_ID) return msg($('signMsg'), 'Google sign-in isn’t set up yet.');
  const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
  s.onload = () => { gsiLoaded = true; renderGsi(); };
  document.head.appendChild(s);
}
let gsiInitialised = false;
function renderGsi() {
  if (!gsiInitialised) {
    google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onCredential, hd: window.ALLOWED_DOMAIN || undefined, itp_support: true });
    gsiInitialised = true;
  }
  const btn = $('gsiBtn');
  if (btn && !btn.dataset.drawn) {
    google.accounts.id.renderButton(btn, { theme: 'outline', size: 'large', shape: 'pill', text: 'signin_with', width: 280 });
    btn.dataset.drawn = '1';
  }
}
async function onCredential(resp) {
  msg($('signMsg'), 'Signing in…', true);
  const r = await api('googleSignIn', { credential: resp.credential });
  if (!r.ok) return msg($('signMsg'), r.message);
  token = r.token; store.set('oc_token', token);
  me = { name: r.name, email: r.email, picture: r.picture || '' }; store.set('oc_me', JSON.stringify(me));
  if (r.status === 'approved') enterApp(); else showPending(r.message);
}
function showSignIn() {
  $('app').hidden = true; $('signin').hidden = false; $('whoAreYou').hidden = true;
  $('gsiBtn').hidden = false; $('pendingBox').hidden = true;
  $('domainHint').textContent = window.ALLOWED_DOMAIN ? 'Use your ' + ALLOWED_DOMAIN + ' account.' : '';
  loadGsi();
}
function signedOut(message) {
  token = ''; store.del('oc_token');
  showSignIn(); if (message) msg($('signMsg'), message);
}
let pendingTimer;
function showPending(message) {
  $('app').hidden = true; $('signin').hidden = false;
  $('gsiBtn').hidden = true; $('pendingBox').hidden = false; $('domainHint').textContent = me ? 'Signed in as ' + me.email : '';
  $('signText').textContent = 'Waiting for approval';
  msg($('signMsg'), message || 'Your request has been sent.', true);
  clearInterval(pendingTimer); pendingTimer = setInterval(() => { if (!document.hidden) checkApproval(); }, 30000);
}
async function checkApproval(manual) {
  const r = await api('whoami');
  if (r.ok) { clearInterval(pendingTimer); enterApp(); }
  else if (manual && r.status === 'pending') toast('Still waiting for approval.');
}
$('btnCheckAgain').onclick = () => checkApproval(true);
$('btnOtherAccount').onclick = async () => { await api('signOut'); clearInterval(pendingTimer); if (window.google) google.accounts.id.disableAutoSelect(); signedOut(); };

$('btnAccount').onclick = () => {
  sheet({ title: me ? me.name : 'Account', text: me ? me.email + (personName ? '\nWorking as: ' + personName : '') : '', buttons: [
    { label: 'Change person', onClick: () => { closeSheet(); store.del('oc_personId'); personId = ''; showWhoAreYou(); } },
    { label: 'Refresh data', onClick: () => { closeSheet(); refreshAll(); } },
    { label: 'Sign out', style: 'danger', onClick: async () => { closeSheet(); await api('signOut'); if (window.google) google.accounts.id.disableAutoSelect(); ['oc_me','oc_artists','oc_list_drafts','oc_list_inbox','oc_list_archive','oc_personId'].forEach(store.del); personId = ''; signedOut('You’re signed out.'); } },
    { label: 'Close', onClick: closeSheet } ] });
};

async function showWhoAreYou() {
  $('app').hidden = true; $('signin').hidden = true; $('whoAreYou').hidden = false;
  $('newPersonForm').hidden = true; $('whoMsg').textContent = '';
  const r = await api('p2_getPeople');
  const box = $('personList'); box.innerHTML = '';
  if (r.ok && r.people && r.people.length) {
    r.people.forEach((p, i) => {
      const btn = document.createElement('button');
      btn.className = 'person-btn'; btn.type = 'button';
      btn.innerHTML = `<div class="av c${(i%4)+1}">${esc(initials(p.name))}</div><div><div class="name">${esc(p.name)}</div><div class="role">Team member</div></div>`;
      btn.onclick = () => pickPerson(p.id, p.name);
      box.appendChild(btn);
    });
  }
  const add = document.createElement('button');
  add.className = 'person-btn'; add.type = 'button'; add.style.borderStyle = 'dashed'; add.style.justifyContent = 'center';
  add.innerHTML = '+ I\'m someone new';
  add.onclick = () => { $('newPersonForm').hidden = false; $('newPersonName').focus(); };
  box.appendChild(add);
}
function pickPerson(id, name) {
  personId = id; personName = name;
  store.set('oc_personId', id); store.set('oc_personName', name);
  $('whoAreYou').hidden = true;
  finishEnterApp();
}
$('cancelNewPerson').onclick = () => { $('newPersonForm').hidden = true; };
$('saveNewPerson').onclick = async () => {
  const name = $('newPersonName').value.trim(); if (!name) return;
  busy($('saveNewPerson'), 'Saving…');
  const r = await api('p2_setMyPerson', { name });
  idle($('saveNewPerson'));
  if (!r.ok) return msg($('whoMsg'), r.message);
  pickPerson(r.personId, r.name);
};

/* Routing */
function go(hash, replace) { if (replace) history.replaceState(null, '', hash); else location.hash = hash; if (replace) onRoute(); }
$('fabAdd').onclick = () => go('#/add');

async function onRoute() {
  const raw = location.hash.replace(/^#\/?/, '') || 'inbox';
  const parts = raw.split('/');
  const name = parts[0], param = parts.slice(1).join('/');
  route = { name, param };
  
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('#tabNav a').forEach(a => a.classList.remove('active'));
  const highlight = key => { const a = document.querySelector(`nav.tabs a[data-tab="${key}"]`); if (a) a.classList.add('active'); };
  
  $('btnBack').hidden = true; $('pageTitle').textContent = 'Open Calls'; $('fabAdd').hidden = false;

  if (name === 'add') {
    $('pageTitle').textContent = 'Add an open call'; $('v-add').classList.add('active'); $('fabAdd').hidden = true; return;
  }

  if (name === 'inbox' || name === 'drafts' || name === 'archive') {
    listTab = LISTS[name] ? name : 'inbox';
    highlight('inbox'); $('v-inbox').classList.add('active');
    document.querySelectorAll('#subTabs button').forEach(b => b.classList.toggle('active', b.dataset.sub === listTab));
    loadList(listTab); return;
  }

  if (name === 'entry') {
    highlight('inbox'); $('v-entry').classList.add('active'); $('fabAdd').hidden = true;
    const row = Number(param);
    let found = Object.keys(LISTS).map(k => (lists[k] || []).find(e => e.row === row)).find(Boolean);
    if (!found) {
      const r = await api('p2_getEntry', { row });
      if (r.ok) { found = r.entry; }
      else { toast('Entry not found.'); return go('#/inbox', true); }
    }
    openEditor(null, found); return;
  }

  if (name === 'artists') { highlight('artists'); $('pageTitle').textContent = 'Artists'; $('v-artists').classList.add('active'); $('fabAdd').hidden = true; loadArtistsList(); return; }
  if (name === 'artist') { highlight('artists'); $('v-artist-detail').classList.add('active'); $('fabAdd').hidden = true; $('btnBack').hidden = false; $('backLabel').textContent = 'Artists'; loadArtistDetail(param); return; }
  if (name === 'pipeline') { highlight('pipeline'); $('pageTitle').textContent = 'Pipeline'; $('v-pipeline').classList.add('active'); loadPipeline(); return; }
  if (name === 'dashboard') { highlight('dashboard'); $('pageTitle').textContent = 'Dashboard'; $('v-dashboard').classList.add('active'); loadDashboard(); return; }
  if (name === 'doc-review') { highlight('artists'); $('v-doc-review').classList.add('active'); $('fabAdd').hidden = true; $('btnBack').hidden = false; $('backLabel').textContent = 'Back'; loadDocReview(param); return; }

  go('#/inbox', true);
}
window.addEventListener('hashchange', onRoute);
$('btnBack').onclick = () => history.length > 1 ? history.back() : go('#/inbox');

document.querySelectorAll('#subTabs button').forEach(btn => {
  btn.onclick = () => go('#/' + btn.dataset.sub, true);
});

/* Lists */
async function loadList(tab) {
  if (!lists[tab]) $('inboxList').innerHTML = '<div class="skel"></div><div class="skel"></div>';
  const r = await api(LISTS[tab].action);
  if (!r.ok) { $('inboxList').innerHTML = `<div class="err-box">${esc(r.message)}</div>`; return; }
  lists[tab] = r.entries || []; store.set('oc_list_' + tab, JSON.stringify(lists[tab]));
  setBadge('drafts', lists.drafts ? lists.drafts.length : 0);
  setBadge('inbox', lists.inbox ? lists.inbox.length : 0);
  if (listTab === tab) renderList();
}
function setBadge(tab, n) {
  const b = $('badge-' + tab); if (b) b.textContent = n ? n : '';
  const sb = $('sbadge-' + tab); if (sb) sb.textContent = n ? `(${n})` : '';
}
function syncFilterUI() {
  const f = filters[listTab];
  $('q').value = f.q || ''; $('fSoon').classList.toggle('on', !!f.soon);
  $('fCat').value = f.cat || ''; $('fCat').classList.toggle('on', !!f.cat);

}

function renderList() {
  const tab = listTab, all = lists[tab], box = $('inboxList');
  if (!all) return;
  syncFilterUI();
  const f = filters[tab], q = (f.q || '').toLowerCase().trim();
  
  let items = all.filter(e => {
    if (q && ![e.title, e.organiser, e.artists, e.category, e.location].some(v => String(v || '').toLowerCase().includes(q))) return false;
    if (f.cat && e.category !== f.cat) return false;
    if (f.artist && !splitNames(e.artists).includes(f.artist)) return false;
    if (f.soon) { const d = deadlineInfo(e.deadline).days; if (!(d >= 0 && d <= 30)) return false; }
    return true;
  });
  
  if ((f.sort || 'deadline') === 'deadline') {
    const key = e => { const d = deadlineInfo(e.deadline).days; return d < 0 ? 1e7 - d : d === Infinity ? 1e6 : d; };
    items = items.slice().sort((a, b) => key(a) - key(b));
  } else items = items.slice().sort((a, b) => (b.addedTs || 0) - (a.addedTs || 0));

  if (!items.length) {
    const [h, p] = LISTS[tab].empty;
    box.innerHTML = `<div class="empty"><b>${h}</b>${p}${tab !== 'archive' ? '<br><button class="btn primary" style="margin-top:16px" onclick="location.hash=\'#/add\'">Add an open call</button>' : ''}</div>`;
    return;
  }

  const frag = document.createDocumentFragment();
  items.forEach(e => {
    const dl = deadlineInfo(e.deadline);
    const stage = e['pipeline stage'] || 'Assigned';
    let pillCls = 'muted';
    if (stage === 'Approved to send') pillCls = 'amber';
    if (stage === 'In doc') pillCls = 'purple';
    if (stage === 'Emailed') pillCls = 'blue';
    if (stage === 'Responded' || stage === 'Applied' || stage === 'Outcome') pillCls = 'green';

    const card = document.createElement('div');
    card.className = 'card';
    
    const names = splitNames(e.artists);
    const avs = names.length ? `<div class="avs">${names.map((n, i) => `<div class="av c${(i%4)+1}">${esc(initials(n))}</div>`).join('')}</div>` : '';
    const artistName = names.length ? (names.length === 1 ? names[0] : names.length + ' artists') : 'No artist yet';

    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <h3>${esc(e.title || 'Untitled')}</h3>
        <span class="dl ${dl.cls}">${esc(dl.text)}</span>
      </div>
      <div class="sub">${esc(e.organiser || '')} ${e.organiser && e.category ? '·' : ''} ${esc(e.category || '')}</div>
      <div class="foot">
        ${avs}
        <span>${esc(artistName)}</span>
        <span class="pill ${pillCls}" style="font-size:11px;margin-left:auto">${esc(stage)}</span>
      </div>`;
      
    card.onclick = () => go('#/entry/' + e.row);
    frag.appendChild(card);
  });
  box.innerHTML = ''; box.appendChild(frag);
}

$('fileInput').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
async function addFiles(files) {
  files = [...files];
  for (const f of files) {
    if (f.type === 'application/pdf') {
      const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(f); });
      uploads.push({ data: b64, mimeType: 'application/pdf', isPdf: true, name: f.name });
    } else if (/^image\//.test(f.type)) {
      const b64 = await new Promise((res, rej) => {
        const url = URL.createObjectURL(f), img = new Image();
        img.onload = () => { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; c.getContext('2d').drawImage(img,0,0); res(c.toDataURL('image/jpeg',0.8).split(',')[1]); };
        img.src = url;
      });
      uploads.push({ data: b64, mimeType: 'image/jpeg', isPdf: false, name: f.name });
    }
  }
  renderThumbs();
}
function renderThumbs() {
  const box = $('thumbs'); box.innerHTML = '';
  uploads.forEach((f, i) => {
    const d = document.createElement('div'); d.className = 'thumb'; d.style.cssText = 'position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line)';
    d.innerHTML = f.isPdf ? '<div style="display:grid;place-items:center;height:100%;font-size:13px;font-weight:700;color:var(--ink3)">PDF</div>' : `<img src="data:image/jpeg;base64,${f.data}" style="width:100%;height:100%;object-fit:cover">`;
    d.innerHTML += `<button type="button" style="position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer" onclick="uploads.splice(${i},1);renderThumbs()">✕</button>`;
    box.appendChild(d);
  });
}

async function openEditor(data, row) {

    $('entrySubtitle').textContent = `${row.category || 'Call'} · Deadline: ${dl.text !== 'No deadline' ? dl.text : 'None'}`;
  }

  // Fill Read-only view
  $('e_fee').textContent = row ? (row['application fee'] || 'Free') : (data?.fee || 'Free');
  $('e_location').textContent = row ? (row.location || '—') : (data?.location || '—');
  $('e_organiser').textContent = row ? (row.organiser || '—') : (data?.organiser || '—');
  $('e_link').innerHTML = row ? (safeUrl(row['application link']) ? `<a href="${esc(row['application link'])}" target="_blank" style="color:var(--ink)">${esc(row['application link'])} ↗</a>` : '—') : (safeUrl(data?.link) ? `<a href="${esc(data.link)}" target="_blank" style="color:var(--ink)">${esc(data.link)} ↗</a>` : '—');

  const d = row ? Object.fromEntries(Object.entries(SHEET_MAP).map(([k, col]) => [k, row[col] == null ? '' : String(row[col])])) : data;
  FIELDS.forEach(k => { $('f_' + k).value = d[k] || ''; });
  $('f_type').value = d.type || '';
  
  if (row) splitNames(row.artists).forEach(n => picked.add(n));
  renderArtistChips();

  // Wizard Trail
  renderTrail(row);

  // Toggle view/edit state
  $('entryPanel').hidden = isEditing && !row; 
  $('form').hidden = !isEditing && !!row;
  
  if (isEditing) {
    $('btnSecondary').textContent = 'Cancel';

  } else {

    $('btnPrimary').textContent = 'Save';
  }

  $('entryMsg').textContent = '';
}

function renderTrail(row) {
  const box = $('entryTrail');
  if (!row || row.status !== 'Confirmed') { box.innerHTML = ''; return; }
  
  const stage = row['pipeline stage'] || 'Assigned';
  let currentIdx = TRAIL_STEPS.indexOf(stage);
  if (currentIdx === -1) currentIdx = 0;
  
  let html = '<div class="trail">';
  
  html += `
    <div class="trail-step">
      <div class="dot done"></div>
      <div class="content"><div class="step-title">Confirmed</div><div class="step-meta">Saved to Inbox</div></div>
    </div>`;

  TRAIL_STEPS.forEach((s, i) => {
    const isDone = i < currentIdx;
    const isCurrent = i === currentIdx;
    
    let dotHtml = isDone ? '<div class="dot done"></div>' : isCurrent ? `<div class="dot current" style="font-size:13px">${i+1}</div>` : '<div class="dot future"></div>';
    
    let actionHtml = '';
    if (isCurrent) {
      if (s === 'Approved to send') {
        const artist = splitNames(row.artists)[0] || 'Artist';
        actionHtml = `<div class="step-action"><button class="btn primary sm" onclick="location.hash='#/doc-review/${encodeURIComponent(artist)}'">Add to ${esc(artist)}'s doc →</button></div>`;
      }
      if (s === 'Assigned') {
        actionHtml = `<div class="step-action" style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="chip dashed" onclick="alert('Use Edit Details to assign')">+ Marita</button>
          <button class="chip dashed" onclick="alert('Use Edit Details to assign')">+ Priya</button>
        </div>`;
      }
      if (s === 'Emailed') {
        actionHtml = `<div class="step-action">
          <select class="f" style="min-height:36px;font-size:13px;max-width:220px" onchange="recordResponse(this.value)">
            <option value="">What did the artist say?</option>
            <option ${row['artist response']==='Interested'?'selected':''}>Interested</option>
            <option ${row['artist response']==='Not interested'?'selected':''}>Not interested</option>
            <option ${row['artist response']==='Wants more info'?'selected':''}>Wants more info</option>
            <option ${row['artist response']==='No response yet'?'selected':''}>No response yet</option>
          </select>
        </div>`;
      }
    }

    html += `
      <div class="trail-step">
        ${dotHtml}
        <div class="content">
          <div class="step-title" ${isCurrent ? '' : 'style="color:var(--ink3)"'}>${esc(s)}</div>
          ${isCurrent ? `<div class="step-meta">Current stage</div>` : ''}
          ${actionHtml}
        </div>
      </div>`;
  });
  
  html += '</div>';
  box.innerHTML = html;
}
window.recordResponse = async (val) => {
  if (!entry || !val) return;
  const r = await api('p2_recordArtistResponse', { row: entry.row, expectTitle: entry.title, response: val, personId });

  toast('Response recorded.');

};

/* Pipeline */
async function loadPipeline() {
  const box = $('pipelineContent'); box.innerHTML = '<div class="skel"></div><div class="skel"></div>';
  const r = await api('p2_pipeline');
  if (!r.ok) { box.innerHTML = `<div class="err-box">${esc(r.message)}</div>`; return; }
  
  let total = 0;
  r.stageOrder.forEach(s => total += r.stages[s].length);
  total = total || 1;
  
  let html = '<div class="pipeline" style="margin:8px 0 24px">';
  r.stageOrder.forEach(stage => {
    const n = r.stages[stage].length;
    const pct = Math.round((n / total) * 100);
    html += `<div class="pipe-row"><span class="label">${esc(stage)}</span><div class="bar-wrap"><div class="bar" style="width:${pct}%;background:var(--ink3)">${n}</div></div><span class="count">${n}</span></div>`;
  });
  html += '</div>';

  const attention = [];
  ['Assigned', 'Approved to send', 'In doc'].forEach(stage => {
    (r.stages[stage] || []).forEach(e => {
      const dl = deadlineInfo(e.deadline);
      if (dl.days >= 0 && dl.days <= 7) attention.push(e);
    });
  });
  if (attention.length) {
    html += '<div class="section-label">Needs attention</div>';
    attention.forEach(e => {
      const dl = deadlineInfo(e.deadline);
      html += `<div class="card" onclick="location.hash='#/entry/${e.row}'"><div style="display:flex;justify-content:space-between;align-items:flex-start"><h3 style="font-size:14px">${esc(e.title)}</h3><span class="dl ${dl.cls}">${esc(dl.text)}</span></div><div class="sub">${esc(e.artists || 'No artist')} · ${esc(e.category || '')}</div><div class="foot"><span class="pill amber" style="font-size:11px">${esc(e.stage || 'Assigned')}</span></div></div>`;
    });
  }
  box.innerHTML = html;
}

/* Doc Review */
async function loadDocReview(nameParam) {
  const name = decodeURIComponent(nameParam);
  const box = $('docReviewContent'); box.innerHTML = '<div class="skel"></div>';
  const dr = await api('p2_getArtistDoc', { artist: name });
  if (!dr.ok) { box.innerHTML = `<div class="err-box">${esc(dr.message)}</div>`; return; }

  const pr = await api('p2_pipeline');
  let calls = [];
  if (pr.ok) {
    pr.stageOrder.forEach(stage => {
      (pr.stages[stage] || []).forEach(e => {
        if (splitNames(e.artists).some(a => a.toLowerCase() === name.toLowerCase())) calls.push(Object.assign({ stage }, e));
      });
    });
  }

  const newCalls = calls.filter(c => c.stage === 'Approved to send');
  const inDoc = calls.filter(c => c.stage === 'In doc');
  const emailed = calls.filter(c => ['Emailed', 'Responded', 'Applied', 'Outcome'].includes(c.stage));

  let html = `<div style="display:flex;align-items:center;gap:14px;margin:8px 0 20px"><div class="av c1" style="width:44px;height:44px;font-size:16px">${esc(initials(name))}</div><div><h2 style="font-size:18px;font-weight:600">${esc(name)}'s doc</h2></div></div>`;

  if (newCalls.length) {
    html += `<div class="section-label">New — will be added (${newCalls.length})</div><div class="doc-preview">`;
    newCalls.forEach(c => { html += `<div class="item"><div><div class="title">${esc(c.title)}</div><div class="meta">${esc(c.category)} · Deadline: ${esc(c.deadline)}</div></div><span class="pill amber" style="font-size:11px">New</span></div>`; });
    html += `</div><div class="approval-bar"><div class="who">${newCalls.length} new calls ready to send</div><div class="btns"><a class="btn sm" href="${esc(dr.docUrl)}" target="_blank" style="flex:1">Open doc ↗</a><button class="btn sm primary" style="flex:1" id="btnAddToDoc">Add to doc</button></div></div>`;
  }
  
  if (inDoc.length) {
    html += `<div class="section-label">In doc (not sent)</div><div class="doc-preview">`;
    inDoc.forEach(c => { html += `<div class="item"><div><div class="title">${esc(c.title)}</div><div class="meta">${esc(c.category)}</div></div></div>`; });
    html += `</div><div class="approval-bar"><button class="btn primary block" id="btnApproveDoc">Approve & mark emailed</button></div>`;
  }

  if (emailed.length) {
    html += `<div class="section-label">Already sent</div><div class="doc-preview">`;
    emailed.forEach(c => { html += `<div class="item"><div><div class="title">${esc(c.title)}</div><div class="meta">${esc(c.category)}</div></div><span class="pill green" style="font-size:11px">Sent</span></div>`; });
    html += `</div>`;
  }

  box.innerHTML = html;

  if (newCalls.length) $('btnAddToDoc').onclick = async () => {
    busy($('btnAddToDoc'), 'Adding…');
    await api('p2_addToDoc', { artist: name, rows: newCalls.map(c => c.row), personId });
    toast('Added.'); loadDocReview(nameParam);
  };
  if (inDoc.length) $('btnApproveDoc').onclick = async () => {
    busy($('btnApproveDoc'), 'Approving…');
    await api('p2_approveDoc', { artist: name, personId });
    toast('Approved.'); loadDocReview(nameParam);
  };
}

/* Boot */
async function enterApp() {
  $('signin').hidden = true;
  if (!personId) return showWhoAreYou();
  finishEnterApp();
}
function finishEnterApp() {
  $('whoAreYou').hidden = true; $('app').hidden = false;
  $('btnAccount').innerHTML = me && me.picture ? `<img alt="" src="${esc(me.picture)}" referrerpolicy="no-referrer">` : esc(me ? initials(me.name) : '?');
  if (!location.hash) history.replaceState(null, '', '#/inbox');
  onRoute();
  api('artists').then(r => { if (r.ok) artists = r.artists; });
}
(async () => {
  if (!token) return showSignIn();
  const r = await api('whoami');
  if (r.ok) { me = Object.assign({}, me || {}, { name: r.name, email: r.email }); store.set('oc_me', JSON.stringify(me)); enterApp(); }
  else showSignIn();
})();
})();
</script>
