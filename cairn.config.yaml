ignore:
  - target
  - "*.v1.*"
  - "*.v2-fast.*"
  - "*.pre-redesign-backup.*"
  - "*.backup.*"
context: "Open Calls (Tikorix) artist opportunity and submission lifecycle management platform."
rules: {}
targets:
  - node: opencalls.web.shell
    path: index.html
    language: assets
  - node: opencalls.web.shell
    path: Main.js
    language: assets
  - node: opencalls.web.inbox
    path: Part1_Inbox.js
    language: assets
  - node: opencalls.web.artists
    path: Part2_Artists.js
    language: assets
  - node: opencalls.web.dashboard
    path: Part2_Dashboard.js
    language: assets
  - node: opencalls.web.docs
    path: Part2_Docs.js
    language: assets
  - node: opencalls.services.auth
    path: Auth.js
    language: assets
  - node: opencalls.services.ai
    path: AI.js
    language: assets
  - node: opencalls.services.applications
    path: Applications.js
    language: assets
  - node: opencalls.services.applications
    path: Fields.js
    language: assets
  - node: opencalls.services.applications
    path: Part2_Lifecycle.js
    language: assets
  - node: opencalls.services.calendar
    path: Calendar.js
    language: assets
  - node: opencalls.services.documents
    path: Documents.js
    language: assets
  - node: opencalls.services.reminders
    path: Reminders.js
    language: assets
  - node: opencalls.services.reminders
    path: Alerts.js
    language: assets
  - node: opencalls.services.reports
    path: Reports.js
    language: assets
  - node: opencalls.services.config
    path: Config.js
    language: assets
  - node: opencalls.services.config
    path: Categories.js
    language: assets
  - node: opencalls.services.config
    path: Utils.js
    language: assets
